<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#0f172a">
<title>Usta Ortak Hesap — Test Modu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e2e8f0;color:#0f172a}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr}.bar{background:#0f172a;color:#fff;padding:12px 14px;box-shadow:0 2px 12px #0004;z-index:5}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:900;font-size:15px}.sub{font-size:11px;color:#cbd5e1;margin-top:3px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:900;background:#22c55e;color:#052e16;white-space:nowrap}.btn:disabled{opacity:.55}.result{display:none;margin-top:10px;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.5}.result.show{display:block}.result.run{background:#eff6ff;color:#1e3a8a;border:1px solid #93c5fd}.result.good{background:#f0fdf4;color:#166534;border:1px solid #86efac}.result.bad{background:#fef2f2;color:#991b1b;border:1px solid #fca5a5}.result b{font-size:14px}iframe{border:0;width:100%;height:100%;background:#f1f5f9}
@media(max-width:430px){.top{align-items:flex-start}.btn{font-size:12px;padding:9px 10px}.title{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="top">
      <div><div class="title">🧪 V5.2 TAM SİSTEM TEST MODU</div><div id="ready" class="sub">Çalışan uygulama yükleniyor…</div></div>
      <button id="run" class="btn" disabled>Tam Sistem Testi</button>
    </div>
    <div id="result" class="result"></div>
  </div>
  <iframe id="app" title="Usta Ortak Hesap"></iframe>
</div>
<script>
const $=id=>document.getElementById(id),frame=$("app"),btn=$("run"),result=$("result"),ready=$("ready");
function show(kind,html){result.className="result show "+kind;result.innerHTML=html}
function independent(es){let inc=0,exp=0,mc=0,mp=0,out=0,inn=0;for(const e of es){if(e.type==="income"){inc+=e.amountCents;if(e.person==="Ben")mc+=e.amountCents}else if(e.type==="expense"){exp+=e.amountCents;if(e.person==="Ben")mp+=e.amountCents}else if(e.type==="transfer"){if(e.person==="Ben")out+=e.amountCents;else inn+=e.amountCents}}const net=inc-exp,share=Math.trunc(net/2),cash=mc-mp-out+inn;return{net,settlement:cash-share}}
function idbTest(){return new Promise((resolve,reject)=>{if(!("indexedDB" in window))return reject(new Error("IndexedDB desteklenmiyor"));const name="__uoh_sys_"+Date.now()+Math.random(),store="s",key="k",val="v"+Math.random();const r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore(store);r.onerror=()=>reject(r.error||new Error("IndexedDB açılamadı"));r.onsuccess=()=>{const db=r.result;const tx=db.transaction(store,"readwrite");tx.objectStore(store).put(val,key);tx.onerror=()=>reject(tx.error||new Error("IndexedDB yazma hatası"));tx.oncomplete=()=>{const q=db.transaction(store,"readonly").objectStore(store).get(key);q.onerror=()=>reject(q.error||new Error("IndexedDB okuma hatası"));q.onsuccess=()=>{const got=q.result;db.close();indexedDB.deleteDatabase(name);got===val?resolve(true):reject(new Error("IndexedDB yaz/oku eşleşmedi"))}}}})}
frame.addEventListener("load",()=>{setTimeout(()=>{try{const w=frame.contentWindow;const ok=typeof w.calculateLedger==="function"&&typeof w.auditTotals==="function"&&typeof w.parseAmount==="function"&&typeof w.validateState==="function";if(!ok)throw new Error("Uygulama hesap fonksiyonları yüklenmedi");ready.textContent="Hazır • mevcut kayıtlarına dokunmadan test yapılacak";btn.disabled=false}catch(e){ready.textContent="Test modu hazırlanamadı";show("bad","<b>❌ Test modu açılamadı</b><br>"+String(e.message||e))}},250)});
frame.src="./index.html?v=testmode-20260915";
btn.addEventListener("click",runTests);
async function runTests(){btn.disabled=true;btn.textContent="Test çalışıyor…";show("run","<b>Test başladı…</b><br>Canlı kayıtların değiştirilmiyor.");const w=frame.contentWindow,start=performance.now();let checks=0;const must=(x,m)=>{if(!x)throw new Error(m);checks++};const E=(t,c,p,id)=>({id:id||("T"+Math.random()),date:"2026-09-15",job:"TEST",type:t,desc:"sistem testi",amountCents:c,person:p,note:"",createdAt:"2026-09-15T00:00:00Z"});const S=(n,a,net,due)=>{const t=w.calculateLedger(a),o=independent(a),au=w.auditTotals(t);must(au.ok,n+": iç denetim");must(t.net===net,n+": net kâr");must(t.settlement===due,n+": denkleştirme");must(t.net===o.net&&t.settlement===o.settlement,n+": bağımsız formül")};let beforeState=null,beforeLocal=null,key=null;try{
  try{w.eval("runSelfTests()") ;checks++}catch(e){throw new Error("Dahili öz-testler başarısız: "+(e.message||e))}
  beforeState=w.eval("serializeState(state)");key=w.eval("KEY");beforeLocal=w.localStorage.getItem(key);
  S("Basit gelir",[E("income",1000000,"Ben")],1000000,500000);
  S("Ben gider",[E("income",1300000,"Ben"),E("expense",400000,"Ben")],900000,450000);
  S("Usta tahsil/Ben gider",[E("income",1300000,"Usta"),E("expense",400000,"Ben")],900000,-850000);
  S("Yarı tahsil/Ben gider",[E("income",650000,"Ben"),E("income",650000,"Usta"),E("expense",400000,"Ben")],900000,-200000);
  S("Usta gider",[E("income",1000000,"Ben"),E("expense",200000,"Usta")],800000,600000);
  S("Tam ödeme",[E("income",1000000,"Ben"),E("transfer",500000,"Ben")],1000000,0);
  S("Kısmi ödeme",[E("income",1000000,"Ben"),E("transfer",200000,"Ben")],1000000,300000);
  S("Fazla ödeme",[E("income",1000000,"Ben"),E("transfer",600000,"Ben")],1000000,-100000);
  S("Tek kuruş",[E("income",10001,"Ben")],10001,5001);
  const a=[E("income",875000,"Ben"),E("expense",125000,"Usta")],x=w.calculateLedger(a),y=w.calculateLedger([...a,E("transfer",12345,"Ben")]);must(x.income===y.income&&x.expense===y.expense&&x.net===y.net&&x.myShare===y.myShare&&x.partnerShare===y.partnerShare,"Ortak ödemesi kâr/payları değiştirdi");
  for(const [v,want] of [["1250",125000],["1.250",125000],["1.250,50",125050],["1250.50",125050],["0",null],["-10",null],["1,000",null],["1.2.3",null]])must(w.parseAmount(v)===want,"Tutar testi: "+v);
  const ver=w.eval("VERSION");const bad={version:ver,entries:[{...E("income",10000,"Ben","bad"),date:"2026-02-30"}]};must(!w.validateState(bad).ok,"Geçersiz tarih kabul edildi");const d=E("income",10000,"Ben","dup");must(!w.validateState({version:ver,entries:[d,{...d}]}).ok,"Yinelenen ID kabul edildi");
  let m=[E("income",100000,"Ben","m1")],b=w.calculateLedger(m);m=[E("expense",10000,"Ben","m2"),...m];let q=w.calculateLedger(m);must(q.net===b.net-10000,"Ekleme simülasyonu");m=m.map(e=>e.id==="m2"?{...e,amountCents:15000}:e);let z=w.calculateLedger(m);must(z.net===q.net-5000,"Düzenleme simülasyonu");const del=m[0];m=m.slice(1);must(w.calculateLedger(m).net===b.net,"Silme simülasyonu");m=[del,...m];must(w.calculateLedger(m).net===z.net,"Geri alma simülasyonu");
  const live=JSON.parse(beforeState),lt=w.calculateLedger(live.entries),lo=independent(live.entries);must(w.auditTotals(lt).ok&&lt.net===lo.net&&lt.settlement===lo.settlement,"Canlı kayıt bağımsız denetim");
  let seed=0x5a17c9e3;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},types=["income","expense","transfer"],people=["Ben","Usta"];
  for(let k=0;k<100000;k++){const r=[],n=1+Math.floor(rnd()*24);for(let i=0;i<n;i++)r.push(E(types[Math.floor(rnd()*3)],1+Math.floor(rnd()*2500000),people[Math.floor(rnd()*2)],"R"+k+"_"+i));const t=w.calculateLedger(r),o=independent(r),au=w.auditTotals(t);if(!au.ok||t.net!==o.net||t.settlement!==o.settlement)throw new Error("Rastgele senaryo #"+(k+1));checks++;if(k&&k%2500===0){show("run","<b>Rastgele matematik:</b> "+k.toLocaleString("tr-TR")+" / 100.000");await new Promise(r=>setTimeout(r,0))}}
  const lk="__uoh_test_"+Date.now(),lv="ok"+Math.random();w.localStorage.setItem(lk,lv);must(w.localStorage.getItem(lk)===lv,"localStorage yaz/oku");w.localStorage.removeItem(lk);await idbTest();checks++;
  must(w.eval("serializeState(state)")===beforeState,"Test canlı state'i değiştirdi");must(w.localStorage.getItem(key)===beforeLocal,"Test ana localStorage kaydını değiştirdi");
  const ms=Math.round(performance.now()-start);show("good","<b>✅ TÜM TESTLER BAŞARILI — KULLANILABİLİR</b><br>"+checks.toLocaleString("tr-TR")+" kontrol tamamlandı.<br>✓ Dahili öz-testler<br>✓ 100.000 rastgele bağımsız matematik karşılaştırması<br>✓ Kritik gelir/gider/ortak ödeme örnekleri<br>✓ Ekleme-düzenleme-silme-geri alma simülasyonu<br>✓ Geçersiz veri reddi<br>✓ Mevcut kayıtların bağımsız kontrolü<br>✓ localStorage ve IndexedDB yaz/oku<br>✓ Gerçek kayıtlar test boyunca değişmedi<br><small>Süre: "+ms.toLocaleString("tr-TR")+" ms</small>");
}catch(e){show("bad","<b>❌ KULLANMAYIN — HATA BULUNDU</b><br>"+String(e.message||e)+"<br><small>Bu sonucu bana gönder; gerçek kayıt girişi yapma.</small>")}finally{btn.disabled=false;btn.textContent="Tam Sistem Testi"}}
</script>
</body>
</html>
