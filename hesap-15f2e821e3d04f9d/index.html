<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Usta Ortak Hesap">
<title>Usta Ortak Hesap</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{text-align:center;padding:24px}.spin{width:38px;height:38px;border:4px solid #cbd5e1;border-top-color:#0f172a;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;color:#64748b;margin-top:8px}</style>
</head>
<body>
<div class="box"><div class="spin"></div><strong>Usta Ortak Hesap açılıyor…</strong><small>Güvenli sürüm yükleniyor.</small></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/felisleorich/dr-beyaz-esya-servisi/b66912c1d1e2ee8270d0704a0a012d488cf5ef25/usta-hesap/index.html';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('Uygulama dosyası alınamadı: '+response.status);
    let html=await response.text();
    html=html.replace('<head>','<head><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Usta Ortak Hesap">');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div class="box"><strong>Uygulama yüklenemedi.</strong><small>'+String(err.message||err)+'</small><small>İnternet bağlantını kontrol edip sayfayı yenile.</small></div>';
  }
})();
</script>
</body>
</html>
