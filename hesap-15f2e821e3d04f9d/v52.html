let m=[E("income",100000,"Ben","m1")],b=calculateLedger(m);m=[E("expense",10000,"Ben","m2"),...m];let q=calculateLedger(m);must(q.net===b.net-10000,"Ekleme simülasyonu");m=m.map(e=>e.id==="m2"?{...e,amountCents:15000}:e);let z=calculateLedger(m);must(z.net===q.net-5000,"Düzenleme simülasyonu");const del=m[0];m=m.slice(1);must(calculateLedger(m).net===b.net,"Silme simülasyonu");m=[del,...m];must(calculateLedger(m).net===z.net,"Geri alma simülasyonu");const live=validateState(state);must(live.ok,"Canlı kayıt doğrulaması");const lt=calculateLedger(live.state.entries),lo=independent(live.state.entries);must(lt.net===lo.net&&lt.settlement===lo.settlement,"Canlı kayıt bağımsız formül");
let seed=0x5a17c9e3;const rnd=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296},types=["income","expense","transfer"],people=["Ben","Usta"];for(let k=0;k<100000;k++){const r=[],n=1+Math.floor(rnd()*24);for(let i=0;i<n;i++)r.push(E(types[Math.floor(rnd()*3)],1+Math.floor(rnd()*2500000),people[Math.floor(rnd()*2)],"R"+k+"_"+i));const t=calculateLedger(r),o=independent(r),au=auditTotals(t);if(!au.ok||t.net!==o.net||t.settlement!==o.settlement)throw new Error("Rastgele matematik senaryosu #"+(k+1));count++;if(k&&k%2500===0){box.innerHTML="<b>Rastgele matematik:</b> "+k.toLocaleString("tr-TR")+" / 100.000";await new Promise(r=>setTimeout(r,0))}}
