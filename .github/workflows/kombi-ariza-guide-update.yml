name: Add Kombi Fault Cluster
on:
  push:
    paths:
      - '.github/workflows/kombi-ariza-guide-update.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add kombi fault cluster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ariza-rehberi.html')
          s=p.read_text(encoding='utf-8')
          marker='</main><section class="cta">'
          section='''<section class="section soft"><div class="wrap"><div class="section-head center"><span class="eyebrow">KOMBİ ARIZA REHBERİ</span><h2>Kombi arızaları</h2><p>Kombi çalışmıyor, sıcak su vermiyor, petekler ısınmıyor, basınç düşüyor, su akıtıyor veya ateşleme yapmıyorsa ilgili rehberi açın.</p></div><div class="service-grid"><article class="service-card"><div><small>KOMBİ</small><h3>Kombi Çalışmıyor</h3><p>Cihaz devreye girmiyor veya hiç çalışmıyorsa.</p><a href="kombi-calismiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Sıcak Su Gelmiyor</h3><p>Musluktan sıcak su gelmiyorsa.</p><a href="kombi-sicak-su-gelmiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Petekler Isınmıyor</h3><p>Kombi çalışıyor ama petekler soğuksa.</p><a href="kombi-petekler-isinmiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Basınç Düşüyor</h3><p>Kombi sık sık su istiyor veya basıncı düşüyorsa.</p><a href="kombi-basinci-dusuyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Su Akıtıyor</h3><p>Cihazın altında su veya damlama varsa.</p><a href="kombi-su-akitiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Ateşleme Yapmıyor</h3><p>Alev oluşmuyor veya ateşleme hatası varsa.</p><a href="kombi-atesleme-yapmiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Sürekli Kapanıyor</h3><p>Çalışıp kısa süre sonra duruyorsa.</p><a href="kombi-surekli-kapaniyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>KOMBİ</small><h3>Ses Yapıyor</h3><p>Uğultu, tıkırtı, ıslık veya titreşim varsa.</p><a href="kombi-ses-yapiyor.html">Rehberi aç →</a></div></article></div><p class="center"><a class="btn secondary" href="kombi-servisi.html">Kombi Servisi sayfasına geç →</a></p></div></section>'''
          if 'KOMBİ ARIZA REHBERİ' not in s:
              s=s.replace(marker,section+marker)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ariza-rehberi.html
          git diff --cached --quiet || git commit -m "Add kombi fault cluster to ariza guide"
          git push
