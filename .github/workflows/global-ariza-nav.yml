name: Add Ariza Guide to All HTML Headers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Arıza Rehberi is visible in every header
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Turkish/root pages: place Arıza Rehberi immediately before Hata Kodları.
              if path.parent == Path('.') and 'Hata Kodları' in text and 'href="ariza-rehberi.html">Arıza Rehberi</a>' not in text:
                  text = text.replace(
                      '<a href="hata-kodlari.html">Hata Kodları</a>',
                      '<a href="ariza-rehberi.html">Arıza Rehberi</a><a href="hata-kodlari.html">Hata Kodları</a>',
                      1
                  )

              # English pages: expose the Turkish site's fault guide as an English-labeled header item.
              if path.parts[:1] == ('en',) and '<a href="../ariza-rehberi.html">Fault Guide</a>' not in text:
                  if '<a href="services.html">Services</a>' in text:
                      text = text.replace(
                          '<a href="services.html">Services</a>',
                          '<a href="services.html">Services</a><a href="../ariza-rehberi.html">Fault Guide</a>',
                          1
                      )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} HTML files')
          for item in changed:
              print(item)

          if not changed:
              raise SystemExit(0)
      - name: Commit header updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'en/*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Add Arıza Rehberi to all page headers"
          git push
