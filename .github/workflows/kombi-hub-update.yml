name: Upgrade Kombi SEO Hub
on:
  push:
    paths:
      - '.github/workflows/kombi-hub-update.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade kombi service hub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('kombi-servisi.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Kombi Servisi | Pendik &amp; Kurtköy | Dr. Beyaz Eşya Servisi</title>','<title>Pendik Kombi Servisi ve Kombi Tamiri | Kurtköy &amp; Tuzla</title>')
          s=s.replace('<meta content="Isınma, sıcak su, basınç ve genel çalışma sorunlarında teknik destek talebinizi iletebilirsiniz." name="description"/>','<meta content="Pendik, Kurtköy ve Tuzla kombi servisi. Kombi çalışmıyor, sıcak su vermiyor, petekler ısınmıyor, basınç düşüyor, su akıtıyor ve ateşleme sorunlarında teknik servis desteği." name="description"/>')
          s=s.replace('https://drbeyazesyaservisi.com/https://images.pexels.com/photos/7859953/pexels-photo-7859953.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1200','https://images.pexels.com/photos/7859953/pexels-photo-7859953.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1200')
          s=s.replace('<span class="eyebrow">PENDİK &amp; KURTKÖY</span><h1>Kombi Servisi</h1><p class="lead">Isınma, sıcak su, basınç ve genel çalışma sorunlarında teknik destek talebinizi iletebilirsiniz.</p>','<span class="eyebrow">PENDİK • KURTKÖY • TUZLA</span><h1>Pendik Kombi Servisi ve Kombi Tamiri</h1><p class="lead">Kombi çalışmıyor, sıcak su vermiyor, petekler ısınmıyor, basınç düşüyor, su akıtıyor veya ateşleme sorunu yaşanıyorsa Pendik, Kurtköy ve Tuzla çevresinde teknik servis desteği için iletişime geçebilirsiniz.</p>')
          s=s.replace('<span>Sıcak su gelmiyor</span><span>Petekler ısınmıyor</span><span>Basınç düşüyor</span><span>Su akıtıyor</span>','<span>Kombi çalışmıyor</span><span>Sıcak su gelmiyor</span><span>Petekler ısınmıyor</span><span>Basınç düşüyor</span><span>Su akıtıyor</span><span>Ateşleme yapmıyor</span>')
          old='''<div class="checklist"><div><b>Sıcak su gelmiyor</b><span>Belirtiye göre arıza tespiti ve uygun servis yönlendirmesi için bilgi paylaşabilirsiniz.</span></div><div><b>Petekler ısınmıyor</b><span>Belirtiye göre arıza tespiti ve uygun servis yönlendirmesi için bilgi paylaşabilirsiniz.</span></div><div><b>Basınç düşüyor</b><span>Belirtiye göre arıza tespiti ve uygun servis yönlendirmesi için bilgi paylaşabilirsiniz.</span></div><div><b>Su akıtıyor</b><span>Belirtiye göre arıza tespiti ve uygun servis yönlendirmesi için bilgi paylaşabilirsiniz.</span></div><div><b>Ses yapıyor</b><span>Belirtiye göre arıza tespiti ve uygun servis yönlendirmesi için bilgi paylaşabilirsiniz.</span></div><div><b>Genel çalışma sorunu</b><span>Belirtiye göre arıza tespiti ve uygun servis yönlendirmesi için bilgi paylaşabilirsiniz.</span></div></div>'''
          new='''<div class="checklist"><div><b>Kombi çalışmıyor:</b><span>Elektrik, basınç, çalışma modu ve cihazın verdiği hata belirtileri birlikte değerlendirilmelidir.</span></div><div><b>Sıcak su gelmiyor:</b><span>Musluk açıldığında cihazın tepki verip vermediği ve suyun ısınıp ısınmadığı önemli belirtilerdir.</span></div><div><b>Petekler ısınmıyor:</b><span>Isıtma modu, basınç ve ısıtma devresinin çalışma koşulları kontrol edilmelidir.</span></div><div><b>Basınç düşüyor:</b><span>Tekrarlayan basınç kaybında sistemdeki su kaybının nedeni araştırılmalıdır.</span></div><div><b>Kombi su akıtıyor:</b><span>Kaçağın cihazın hangi noktasında görüldüğü ve basınçla birlikte değişip değişmediği önemlidir.</span></div><div><b>Kombi ses yapıyor:</b><span>Uğultu, tıkırtı, ıslık veya titreşimin ne zaman oluştuğunu not etmek teknik incelemeyi kolaylaştırır.</span></div><div><b>Ateşleme yapmıyor:</b><span>Ateşleme denemesi, alev oluşumu ve varsa hata kodu teknik değerlendirmede önemlidir.</span></div></div>'''
          s=s.replace(old,new)
          marker='</main><section class="cta">'
          section='''<section class="section soft"><div class="wrap"><div class="section-head center"><span class="eyebrow">KOMBİ ARIZA REHBERİ</span><h2>Kombi arızanıza göre doğru rehbere geçin</h2><p>Arama yapan ziyaretçinin doğrudan yaşadığı belirtiye ulaşabilmesi için kombi arızalarını ayrı rehber sayfalarında topladık.</p></div><div class="service-grid"><article class="service-card"><div><small>ARIZA</small><h3>Kombi Çalışmıyor</h3><p>Cihaz hiç çalışmıyor veya devreye girmiyorsa olası nedenleri inceleyin.</p><a href="kombi-calismiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Kombi Sıcak Su Vermiyor</h3><p>Musluktan sıcak su gelmiyor veya su ısınmıyorsa rehbere geçin.</p><a href="kombi-sicak-su-gelmiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Petekler Isınmıyor</h3><p>Kombi çalışıyor ancak petekler soğuksa belirtileri inceleyin.</p><a href="kombi-petekler-isinmiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Basınç Düşüyor</h3><p>Kombi sık sık su istiyor veya basıncı düşüyorsa nedenleri inceleyin.</p><a href="kombi-basinci-dusuyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Kombi Su Akıtıyor</h3><p>Cihazın altında su veya damlama görüyorsanız rehbere geçin.</p><a href="kombi-su-akitiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Kombi Ateşleme Yapmıyor</h3><p>Alev oluşmuyor veya cihaz ateşleme hatasına geçiyorsa inceleyin.</p><a href="kombi-atesleme-yapmiyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Kombi Sürekli Kapanıyor</h3><p>Çalışıp kısa süre sonra duran kombiler için rehbere geçin.</p><a href="kombi-surekli-kapaniyor.html">Rehberi aç →</a></div></article><article class="service-card"><div><small>ARIZA</small><h3>Kombi Ses Yapıyor</h3><p>Uğultu, tıkırtı, ıslık veya titreşim için belirtileri inceleyin.</p><a href="kombi-ses-yapiyor.html">Rehberi aç →</a></div></article></div></div></section><section class="section"><div class="wrap"><div class="section-head center"><span class="eyebrow">KOMBİ HATA KODLARI</span><h2>Hata kodunu biliyor musunuz?</h2><p>Ekrandaki hata kodunu marka ve model bilgisiyle birlikte kontrol etmek için hata kodları rehberine geçebilirsiniz.</p><a class="btn secondary" href="hata-kodlari.html">Hata Kodları Rehberini Aç →</a></div></div></section>'''
          if 'KOMBİ ARIZA REHBERİ' not in s:
              s=s.replace(marker,section+marker)
          s=s.replace('''<details><summary>Sıcak su gelmiyor için servis talebi oluşturabilir miyim?</summary><p>Evet. Cihazın marka-modelini ve yaşadığınız belirtiyi paylaşarak teknik destek talebinizi iletebilirsiniz.</p></details><details><summary>Petekler ısınmıyor için servis talebi oluşturabilir miyim?</summary><p>Evet. Cihazın marka-modelini ve yaşadığınız belirtiyi paylaşarak teknik destek talebinizi iletebilirsiniz.</p></details><details><summary>Basınç düşüyor için servis talebi oluşturabilir miyim?</summary><p>Evet. Cihazın marka-modelini ve yaşadığınız belirtiyi paylaşarak teknik destek talebinizi iletebilirsiniz.</p></details><details><summary>Su akıtıyor için servis talebi oluşturabilir miyim?</summary><p>Evet. Cihazın marka-modelini ve yaşadığınız belirtiyi paylaşarak teknik destek talebinizi iletebilirsiniz.</p></details>''','''<details><summary>Kombi sıcak su vermiyorsa ne kontrol edilir?</summary><p>Musluk açıldığında cihazın tepki verip vermediği, sıcaklık değişimi ve varsa hata kodu gözlemlenebilir. Marka-model bilgisiyle servis talebi iletebilirsiniz.</p></details><details><summary>Petekler ısınmıyorsa kombi basıncı önemli mi?</summary><p>Basınç, ısıtma sisteminin çalışma koşullarından biridir. Mevcut değeri gözlemleyip cihazın üretici önerilerine göre değerlendirmek ve sorun sürerse teknik destek almak gerekir.</p></details><details><summary>Kombi basıncı sürekli düşüyorsa ne yapılmalı?</summary><p>Tekrarlayan basınç kaybının nedeni araştırılmalıdır. Sadece tekrar tekrar su eklemek yerine cihaz ve ısıtma sistemi teknik olarak değerlendirilmelidir.</p></details><details><summary>Kombi su akıtıyorsa kullanmaya devam etmeli miyim?</summary><p>Kaçağın kaynağı bilinmiyorsa cihazı zorlamayın. Su elektrik aksamına ulaşıyorsa cihazı kullanmayın ve teknik destek alın.</p></details><details><summary>Pendik, Kurtköy ve Tuzla'da kombi servisi alabilir miyim?</summary><p>Pendik, Kurtköy ve Tuzla çevresinde kombi arızası için telefon veya WhatsApp üzerinden servis talebinizi iletebilirsiniz.</p></details>''')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kombi-servisi.html
          git diff --cached --quiet || git commit -m "Upgrade kombi service page for SEO"
          git push
