name: Add Ariza Rehberi to homepage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update homepage
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          old_nav = '<a href="hizmetler.html">Hizmetler</a><a href="hata-kodlari.html">Hata Kodları</a>'
          new_nav = '<a href="hizmetler.html">Hizmetler</a><a href="ariza-rehberi.html">Arıza Rehberi</a><a href="hata-kodlari.html">Hata Kodları</a>'
          if old_nav in s and 'href="ariza-rehberi.html">Arıza Rehberi</a>' not in s:
              s = s.replace(old_nav, new_nav, 1)

          marker = '<section class="section feature"><div class="wrap feature-grid">'
          section = '''<section class="section soft">
  <div class="wrap">
    <div class="section-head center">
      <span class="eyebrow">ARIZA REHBERİ</span>
      <h2>Cihazınızdaki arızayı hızlıca bulun</h2>
      <p>Beyaz eşya, klima ve kombi cihazlarında sık karşılaşılan arızaları inceleyin. Belirtiyi seçerek ilgili teknik servis sayfasına ulaşabilirsiniz.</p>
    </div>
    <div class="area-grid">
      <article class="area-card"><span class="eyebrow">BUZDOLABI</span><h3>Soğutmuyor</h3><p>Soğutmama ve performans kaybının sık görülen nedenlerini inceleyin.</p><a class="btn secondary" href="buzdolabi-sogutmuyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">BUZDOLABI</span><h3>Su Akıtıyor</h3><p>Tahliye, buzlanma ve kapı contası kaynaklı su sorunlarını inceleyin.</p><a class="btn secondary" href="buzdolabi-su-akitiyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">ÇAMAŞIR MAKİNESİ</span><h3>Su Almıyor</h3><p>Su giriş sistemi, filtre ve valf kaynaklı sorunları inceleyin.</p><a class="btn secondary" href="camasir-makinesi-su-almiyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">ÇAMAŞIR MAKİNESİ</span><h3>Su Boşaltmıyor</h3><p>Tahliye filtresi, hortum ve pompa kaynaklı sorunları inceleyin.</p><a class="btn secondary" href="camasir-makinesi-su-bosaltmiyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">ÇAMAŞIR MAKİNESİ</span><h3>Sıkma Yapmıyor</h3><p>Dengesiz yük, tahliye, motor ve kontrol sistemi kaynaklı sorunları inceleyin.</p><a class="btn secondary" href="camasir-makinesi-sikma-yapmiyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">BULAŞIK MAKİNESİ</span><h3>Temiz Yıkamıyor</h3><p>Filtre, püskürtme kolları, su sıcaklığı ve yıkama sistemi sorunlarını inceleyin.</p><a class="btn secondary" href="bulasik-makinesi-temiz-yikamiyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">FIRIN</span><h3>Isıtmıyor</h3><p>Rezistans, termostat ve kontrol sistemi kaynaklı ısıtma sorunlarını inceleyin.</p><a class="btn secondary" href="firin-isitmiyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">KLİMA</span><h3>Soğutmuyor</h3><p>Performans düşüşü ve soğutmama belirtilerinin olası nedenlerini inceleyin.</p><a class="btn secondary" href="klima-sogutmuyor.html">Arızayı İncele →</a></article>
      <article class="area-card"><span class="eyebrow">KOMBİ</span><h3>Sıcak Su Isıtmıyor</h3><p>Sıcak su üretimiyle ilgili sık karşılaşılan arıza belirtilerini inceleyin.</p><a class="btn secondary" href="kombi-su-isitmiyor.html">Arızayı İncele →</a></article>
    </div>
    <div class="section-head center"><a class="btn primary" href="ariza-rehberi.html">Tüm Arıza Rehberini Gör →</a></div>
  </div>
</section>'''
          if marker in s and 'Cihazınızdaki arızayı hızlıca bulun' not in s:
              s = s.replace(marker, section + marker, 1)

          p.write_text(s, encoding="utf-8")

      - name: Commit homepage and remove temporary workflow
        run: |
          rm -f .github/workflows/home-ariza-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/home-ariza-update.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Ana sayfaya Arıza Rehberi bölümü ekle"
          git push
