name: Site checks and Pages

on:
  push:
    branches: [main, codex/site-search-quality, codex/security-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_artifact: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Public pages, links, images and SEO
        run: python scripts/check-site.py
      - name: Security policy and publication checks
        run: |
          python -m unittest discover -s tests -p 'test_security_policy.py'
          python scripts/check-security.py
      - name: Known dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Search catalogue freshness
        run: python scripts/build-search-index.py --check
      - name: JavaScript syntax and regression tests
        run: npm run check:js && npm test
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop, small mobile and WebKit checks
        run: npm run test:browser
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-quality-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14
      - name: Prepare verified site
        id: package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python scripts/package-site.py
          echo "artifact_name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release-site

  pages-source:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      workflow: ${{ steps.source.outputs.workflow }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: source
        with:
          script: |
            const {data} = await github.rest.repos.getPages(context.repo);
            const enabled = data.build_type === 'workflow';
            core.setOutput('workflow', String(enabled));
            await core.summary.addHeading('Pages publishing mode')
              .addRaw(enabled ? 'GitHub Actions: deployment requires passing validation.' : 'Branch deployment is still enabled. Checks run, but do not yet block automatic branch publishing. In Settings > Pages, select GitHub Actions to enable the prepared deployment gate.')
              .write();

  deploy:
    if: needs.pages-source.outputs.workflow == 'true'
    needs: [validate, pages-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish only the validated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.validate.outputs.pages_artifact }}
